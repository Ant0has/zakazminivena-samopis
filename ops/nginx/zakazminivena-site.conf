server {
    server_name zakazminivena.ru www.zakazminivena.ru;

    # Block bad bots
    if ($zakazminivena_bad_bot) {
        return 403;
    }

    # Block _rsc requests from non-browser clients (bot RSC scraping)
    location ~* _rsc= {
        if ($http_user_agent !~* "Mozilla|Chrome|Safari|Firefox|Edge|YaBrowser|Opera") {
            return 403;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/(?:_next/static/|images/|trip-constructor/) {
        # Public frontend files may load together on a cold visit.
        limit_req zone=zakazminivena_assets burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        # Pages and /api keep the original per-IP limit.
        limit_req zone=zakazminivena_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zakazminivena.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zakazminivena.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.zakazminivena.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zakazminivena.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name zakazminivena.ru www.zakazminivena.ru;
    return 404; # managed by Certbot
}
