# Bot blocking map for zakazminivena.ru
map $http_user_agent $zakazminivena_bad_bot {
    default 0;

    # Aggressive SEO crawlers (no value for the site)
    ~*SERankingBacklinksBot 1;
    ~*AhrefsBot 1;
    ~*MJ12bot 1;
    ~*SemrushBot 1;
    ~*keys-so-bot 1;

    # Training crawlers remain blocked; OAI-SearchBot and ChatGPT-User use normal public rate limits
    ~*GPTBot 1;
    ~*ClaudeBot 1;
    ~*Amazonbot 1;
    ~*Bytespider 1;

    # Chinese/irrelevant bots
    ~*Baiduspider 1;
    ~*PetalBot 1;

    # Facebook aggressive crawler
    ~*meta-externalagent 1;

    # Suspicious/automated tools
    ~*okhttp 1;
    "node" 1;
    "curl/8.5.0" 1;
    "-" 1;
}

# Rate limiting zone for zakazminivena
limit_req_zone $binary_remote_addr zone=zakazminivena_limit:10m rate=10r/s;
